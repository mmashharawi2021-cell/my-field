name: Frontend CI
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/frontend-ci.yml']
jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build
        env:
          VITE_PREVIEW_MODE: 'true'
