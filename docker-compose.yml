services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: myfield
      POSTGRES_USER: myfield
      POSTGRES_PASSWORD: myfield
    volumes:
      - myfield_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfield -d myfield"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql+asyncpg://myfield:myfield@db:5432/myfield
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - server
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  myfield_db:
