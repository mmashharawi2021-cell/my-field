[project]
name = "my-field-server"
version = "0.1.0"
description = "My Field local-first GIS backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "geoalchemy2>=0.18,<1",
  "pydantic-settings>=2.10,<3",
  "alembic>=1.16,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
